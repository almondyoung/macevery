name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build macOS release
    runs-on: macos-latest
    env:
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MACEVERY_CODESIGN_CERTIFICATE_P12: ${{ secrets.MACEVERY_CODESIGN_CERTIFICATE_P12 }}
      MACEVERY_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACEVERY_CODESIGN_CERTIFICATE_PASSWORD }}
      MACEVERY_CODESIGN_IDENTITY: ${{ secrets.MACEVERY_CODESIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --release
      - name: Import signing certificate
        if: ${{ env.MACEVERY_CODESIGN_CERTIFICATE_P12 != '' && env.MACEVERY_CODESIGN_CERTIFICATE_PASSWORD != '' }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/macevery-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/macevery-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo -n "$MACEVERY_CODESIGN_CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$MACEVERY_CODESIGN_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[ "]//g')
      - name: Build app bundle
        run: make app
      - name: Notarize app bundle
        if: ${{ env.MACEVERY_CODESIGN_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        run: ./macos/notarize-app.sh .build/MacEvery.app
      - name: Package app
        run: |
          mkdir -p .build/release
          COPYFILE_DISABLE=1 ditto -c -k --norsrc --keepParent .build/MacEvery.app ".build/release/MacEvery-${GITHUB_REF_NAME}-macos.zip"
          cd .build/release
          shasum -a 256 "MacEvery-${GITHUB_REF_NAME}-macos.zip" > "MacEvery-${GITHUB_REF_NAME}-macos.zip.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ".build/release/MacEvery-${GITHUB_REF_NAME}-macos.zip" \
            ".build/release/MacEvery-${GITHUB_REF_NAME}-macos.zip.sha256" \
            --title "MacEvery ${GITHUB_REF_NAME}" \
            --generate-notes
