name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build macOS release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --release
      - name: Build app bundle
        run: make app
      - name: Package app
        run: |
          mkdir -p .build/release
          COPYFILE_DISABLE=1 ditto -c -k --norsrc --keepParent .build/MacEvery.app ".build/release/MacEvery-${GITHUB_REF_NAME}-macos.zip"
          shasum -a 256 ".build/release/MacEvery-${GITHUB_REF_NAME}-macos.zip" > ".build/release/MacEvery-${GITHUB_REF_NAME}-macos.zip.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ".build/release/MacEvery-${GITHUB_REF_NAME}-macos.zip" \
            ".build/release/MacEvery-${GITHUB_REF_NAME}-macos.zip.sha256" \
            --title "MacEvery ${GITHUB_REF_NAME}" \
            --generate-notes
